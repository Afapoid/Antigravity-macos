name: macOS Apple Silicon
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
      - name: Verify native ARM64 runner
        run: test "$(uname -m)" = arm64
      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: Check launcher and macOS regression tests
        run: |
          sh -n tui.sh macos/build.sh
          python3 -m unittest discover -s tests -v
          cargo test --locked --no-default-features -- --test-threads=1
      - name: Build native release
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            export AG_FULL_VERSION="${GITHUB_REF_NAME#v}"
          fi
          sh macos/build.sh
          target/aarch64-apple-darwin/release/ag_unlocker --version
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            release/*.tar.gz
            release/*.sha256
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" \
            --title "macOS Apple Silicon $GITHUB_REF_NAME" --generate-notes
